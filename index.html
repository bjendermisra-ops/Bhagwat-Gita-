function parseReference(q){q=String(q).replace(/[०-९]/g,x=>'०१२३४५६७८९'.indexOf(x));let m=q.trim().match(/^(\d{1,2})\s*[.:/\-]\s*(\d{1,3})$/)||q.trim().match(/^(?:chapter|ch|अध्याय)\s*(\d{1,2})\s*[,\s]*(?:verse|v|श्लोक)\s*(\d{1,3})$/i);return m?`${+m[1]}.${+m[2]}`:null}
function findVerses(q,ch='',field='all'){let ref=parseReference(q);if(ref)return byId.has(ref)?[{v:byId.get(ref),related:false}]:[];let n=norm(q);if(!n)return [];let number=/^\d+$/.test(n);let expanded=aliases[n]||[];let out=[];for(let v of data){if(ch&&v.chapter!==+ch)continue;if(number){if(v.verse===+n)out.push({v,related:false});continue}let fields=field==='all'?['sanskrit','transliteration','hindi','english','marathi','tatparya_'+lang]:field==='meaning'?[lang]:field==='commentary'?['tatparya_'+lang]:[field];let texts=fields.map(k=>norm(v[k]));let exact=texts.some(s=>s.includes(n));let tokens=n.split(' ');let wordsMatch=!exact&&tokens.length>1&&texts.some(s=>tokens.every(w=>s.includes(w)));let related=!exact&&!wordsMatch&&expanded.some(a=>texts.some(s=>s.includes(norm(a))));if(exact||wordsMatch||related)out.push({v,related,score:exact?0:wordsMatch?1:2})}return out.sort((a,b)=>(a.score||0)-(b.score||0))}
function highlight(s,q){let terms=[q].concat(aliases[norm(q)]||[]).filter(x=>x&&x.length>1&&!parseReference(x));let text=esc(s);for(let term of terms){let e=esc(term).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');text=text.replace(new RegExp(e,'gi'),m=>`<mark>${m}</mark>`)}return text}

async function renderCard(){let token=++renderToken;for(let n of ['cardShare','cardDownload'])if($(n))$(n).disabled=true;let canvas=$('cardCanvas');if(!canvas)return;let context=canvas.getContext('2d');context.clearRect(0,0,canvas.width,canvas.height);$('pageLabel').textContent='Rendering…';try{await Promise.all([document.fonts.load('600 48px Deva'),document.fonts.load('400 36px Deva'),document.fonts.load('400 30px Inter')]);let a=art[studioState.art],[img,brandLogo]=await Promise.all([loadImage(a.src),loadImage('logo.png')]);if(token!==renderToken||!$('cardCanvas'))return;let v=byId.get(studioState.id),h={story:1920,portrait:1350,square:1080}[studioState.format];let pages=fitLayout(context,v,1080,h);if(!pages.length){$('pageLabel').textContent='Select at least one text section';cardPages=[];return}cardPages=pages.map((lines,index)=>{let cv=document.createElement('canvas');cv.width=1080;cv.height=h;let c=cv.getContext('2d');let royal=studioState.layout===0,editorial=studioState.layout===1,quiet=studioState.layout===2;let maxBottom=h===1920?1085:h===1350?805:655;let textBottom=Math.min(maxBottom,Math.max(h===1920?760:h===1350?590:500,265+lines.reduce((sum,l)=>sum+l.height+l.gap,0)));let artTop=textBottom+5,artBottom=h-186;c.fillStyle=a.color;c.fillRect(0,0,1080,h);drawArtwork(c,img,artTop,artBottom-artTop,studioState.art===7);let fade=c.createLinearGradient(0,artTop,0,artTop+110);fade.addColorStop(0,a.color);fade.addColorStop(1,a.color+'00');c.fillStyle=fade;c.fillRect(0,artTop,1080,110);let bottom=c.createLinearGradient(0,artBottom-60,0,artBottom);bottom.addColorStop(0,a.color+'00');bottom.addColorStop(1,a.color);c.fillStyle=bottom;c.fillRect(0,artBottom-60,1080,60);if(editorial){c.fillStyle='#f6eddd';c.fillRect(40,40,1000,textBottom-35)}let ink=editorial?'#39261d':'#f9ecd2',gold=editorial?'#896125':'#edc879';c.strokeStyle=gold;c.lineWidth=2;if(royal){c.strokeRect(24,24,1032,h-48);c.globalAlpha=.5;c.strokeRect(35,35,1010,h-70);c.globalAlpha=1;for(let [x,y,sx,sy] of [[44,44,1,1],[1036,44,-1,1],[44,h-44,1,-1],[1036,h-44,-1,-1]]){c.save();c.translate(x,y);c.scale(sx,sy);c.beginPath();c.moveTo(0,60);c.bezierCurveTo(35,40,0,15,60,0);c.moveTo(0,30);c.bezierCurveTo(40,40,40,0,30,0);c.stroke();c.restore()}}c.textAlign='center';c.textBaseline='top';c.fillStyle=gold;font(c,royal?72:62,'sanskrit');c.fillText('श्रीमद्भगवद्गीता',540,65);c.font='400 24px Inter';c.fillStyle=ink;c.fillText(`CHAPTER ${v.chapter}  ·  VERSE ${v.verse}${pages.length>1?'  ·  '+(index+1)+'/'+pages.length:''}`,540,150);c.strokeStyle=gold;c.beginPath();c.moveTo(390,202);c.lineTo(690,202);c.stroke();let y=235;for(let l of lines){font(c,l.size,l.kind);c.fillStyle=l.kind==='sanskrit'?gold:ink;c.textAlign=quiet?'left':'center';c.fillText(l.text,quiet?80:540,y);y+=l.height+l.gap}drawStoreBranding(c,brandLogo,h,studioState.art===7);return cv});cardPage=Math.min(cardPage,cardPages.length-1);displayCard();persist('gita_studio',studioState);$('renderInfo').textContent=`${1080} × ${h} · ${pages.length} ${pages.length===1?'card':'cards'} · ${['Royal','Editorial','Quiet'][studioState.layout]}`;for(let n of ['cardShare','cardDownload'])if($(n))$(n).disabled=false}catch(e){if(token===renderToken&&$('pageLabel')){$('pageLabel').textContent='Could not load artwork or fonts.';$('renderInfo').innerHTML='<button class="textbtn" onclick="renderCard()">Retry rendering</button>';cardPages=[]}}}
function displayCard(){let c=$('cardCanvas'),src=cardPages[cardPage];if(!c||!src)return;c.width=src.width;c.height=src.height;c.getContext('2d').drawImage(src,0,0);$('pageLabel').textContent=`${cardPage+1} / ${cardPages.length}`}
async function exportCard(share){let cv=cardPages[cardPage];if(!cv)return;let name=`Gita-${studioState.id}-${cardPage+1}.jpg`;try{let url=cv.toDataURL('image/jpeg',.95);if(share&&window.AndroidShare?.shareImageToWhatsApp){AndroidShare.shareImageToWhatsApp(url);return}if(!share&&window.AndroidShare?.downloadImage){AndroidShare.downloadImage(url);return}let blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',.95));let file=new File([blob],name,{type:'image/jpeg'});if(share&&navigator.canShare?.({files:[file]})){await navigator.share({files:[file],title:APP_NAME+' · BG '+studioState.id,text:'Download '+APP_NAME+' on Google Play: '+PLAY_STORE_URL});return}downloadBlob(blob,name);toast(share?'Card downloaded. Share it from your gallery.':'Card download requested')}catch(e){if(e.name!=='AbortError')toast('Export failed. Please retry.')}}
function fromHash(){let h=location.hash.slice(1);if(h.startsWith('verse/'))return {page:'reader',id:h.slice(6)};return {page:['home','read','search','studio','library'].includes(h)?h:'home'}}
window.addEventListener('popstate',e=>{stopAudio();route=e.state?.page?e.state:fromHash();render()});window.addEventListener('visibilitychange',()=>{if(!document.hidden){checkDay();scheduleMidnight()}else stopAudio()});function checkDay(){let key=dateKey();if(key!==dailyKey){dailyKey=key;if(route.page==='home')home()}}let midnightTimer;function scheduleMidnight(){clearTimeout(midnightTimer);let next=Date.parse(dateKey()+'T00:00:00+05:30')+86400000;midnightTimer=setTimeout(()=>{checkDay();scheduleMidnight()},Math.max(250,next-Date.now()+50))}scheduleMidnight();setInterval(checkDay,30000);
window.app={handleBack(){if($('dialog').open){$('dialog').close();return true}if(focusMode){toggleFocus();return true}if(route.page!=='home'){go('home');return true}return false},stopAllAudio:stopAudio};
window.showAdLoader=()=>toast('Loading…');window.hideAdLoader=()=>{};window.onAdWatched=()=>toast('Thank you for your support.');
async function init(){applyPreferences();$('settingsButton').innerHTML=icon('settings');try{let r=await fetch('data/gita-v2.json');if(!r.ok)throw Error();data=await r.json();byId=new Map(data.map(v=>[String(v.verse_id),v]));dailyOrder=shuffledVerses();migrate();route=fromHash();history.replaceState(route,'',location.href);render();if('serviceWorker'in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});}catch{$('main').innerHTML='<div class="empty"><h2>Unable to open the collection</h2><p>Connect once to download the reading data.</p><button class="primary" style="margin-top:20px" onclick="init()">Try again</button></div>'}}
init();
